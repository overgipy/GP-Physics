<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>李捷物理 - 單擺與木塊完全彈性碰撞</title>
    <style>
        body { background-color: #0a0c10; color: #fff; display: flex; flex-direction: column; align-items: center; font-family: sans-serif; margin: 0; padding: 20px; }
        #canvas-container { margin: 20px 0; background: #000; border: 1px solid #333; border-radius: 8px; }
        .controls { margin-top: 10px; display: flex; gap: 10px; }
        button { padding: 15px 30px; font-size: 16px; cursor: pointer; background: #00d4ff; border: none; border-radius: 8px; font-weight: bold; }
        #data-panel { margin-top: 20px; padding: 20px; background: #141923; border-radius: 8px; width: 800px; }
    </style>
</head>
<body>
    <h1>單擺與木塊完全彈性碰撞模擬</h1>
    <div id="canvas-container">
        <canvas id="simCanvas" width="800" height="300"></canvas>
    </div>
    <div class="controls">
        <button id="btn_play">釋放單擺</button>
        <button id="btn_reset" style="background:#445; color:white;">重置</button>
    </div>
    <div id="data-panel">
        <h3>碰撞後數據分析</h3>
        <div id="stats">等待碰撞...</div>
    </div>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');
        const L = 180; const pivotX = 400; const pivotY = 30;
        
        let m = 1.0, M = 2.0;
        let theta = Math.PI / 4, omega = 0;
        let phase = 0; 
        
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            let x = pivotX + L * Math.sin(theta);
            let y = pivotY + L * Math.cos(theta);
            ctx.strokeStyle = '#fff'; ctx.lineWidth = 3;
            ctx.beginPath(); ctx.moveTo(pivotX, pivotY); ctx.lineTo(x, y); ctx.stroke();
            ctx.fillStyle = '#00d4ff'; ctx.beginPath(); ctx.arc(x, y, 15, 0, Math.PI*2); ctx.fill();
        }

        function loop() {
            if (phase === 1) {
                omega += (-0.05 * Math.sin(theta));
                theta += omega;
                if (theta <= 0) { 
                    theta = 0; phase = 2; 
                    document.getElementById('stats').innerHTML = "碰撞發生！(動量與能量已轉移)";
                }
            } else if (phase === 2) {
                omega += (-0.05 * Math.sin(theta));
                theta += omega;
                omega *= 0.99; // 極輕微阻尼
            }
            draw();
            if (phase > 0) requestAnimationFrame(loop);
        }

        document.getElementById('btn_play').onclick = () => { if(phase===0) { phase = 1; loop(); } };
        document.getElementById('btn_reset').onclick = () => { phase = 0; theta = Math.PI/4; omega = 0; draw(); document.getElementById('stats').innerHTML = "等待碰撞..."; };
        draw();
    </script>
</body>
</html>
