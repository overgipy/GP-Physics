<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>一維完全彈性碰撞模擬器 - 視覺優化版</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-main: #0a0c10;
            --bg-card: #141923;
            --bg-control: #1d2432;
            --text-main: #f0f3f8;
            --text-muted: #8a99ad;
            --cyan: #00d4ff;
            --pink: #ff2e63;
            --yellow: #ffcc00;
            --green: #00e676;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .nav { width: 100%; max-width: 800px; margin-bottom: 10px; }
        .nav a { color: var(--cyan); text-decoration: none; font-size: 14px; }

        header { text-align: center; margin-bottom: 15px; width: 100%; max-width: 800px; }
        h1 { margin: 0; font-size: 1.6rem; color: var(--cyan); letter-spacing: 1px; }
        p.subtitle { margin: 5px 0 0 0; font-size: 0.9rem; color: var(--text-muted); }

        .container { width: 100%; max-width: 800px; display: flex; flex-direction: column; gap: 15px; }

        .card {
            background-color: var(--bg-card);
            border-radius: 12px; border: 1px solid #252e3d;
            padding: 15px; box-sizing: border-box;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }

        .card-title {
            font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px;
            color: var(--text-muted); margin-bottom: 10px; font-weight: bold;
            display: flex; justify-content: space-between; align-items: center;
        }

        #canvas-container {
            width: 100%; display: flex; justify-content: center;
            background: #080a0f; border-radius: 8px; overflow: hidden; border: 1px solid #1a202c;
            padding: 20px 0;
        }
        canvas { width: 100%; height: auto; max-height: 200px; display: block; }

        .controls-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; margin-bottom: 15px;
        }

        .control-group { background-color: rgba(255,255,255,0.02); padding: 10px; border-radius: 8px; border: 1px solid #222b3a; }
        .control-label { display: flex; justify-content: space-between; font-size: 0.85rem; margin-bottom: 6px; color: #b0c0d6; }
        .control-label b { font-family: monospace; font-size: 1rem; }
        
        .cyan-text { color: var(--cyan); }
        .pink-text { color: var(--pink); }

        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; margin: 0; }
        input[type=range]:focus { outline: none; }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 5px; cursor: pointer; background: #2c3749; border-radius: 3px; }
        input[type=range]::-webkit-slider-thumb {
            height: 16px; width: 16px; border-radius: 50%; background: #fff; cursor: pointer;
            -webkit-appearance: none; margin-top: -5px; box-shadow: 0 0 8px rgba(255,255,255,0.5);
        }

        .playback-bar {
            display: flex; align-items: center; gap: 15px; margin-top: 10px;
            background: rgba(255,255,255,0.03); padding: 10px; border-radius: 8px;
        }

        button {
            background-color: var(--cyan); color: #000; border: none; padding: 8px 16px;
            font-size: 0.9rem; font-weight: bold; border-radius: 6px; cursor: pointer; min-width: 80px;
        }
        button:hover { opacity: 0.9; box-shadow: 0 0 10px rgba(0, 212, 255, 0.5); }

        .chart-container { position: relative; width: 100%; height: 220px; }

        .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; }
        .meter { background: #111622; padding: 12px; border-radius: 8px; text-align: center; border: 1px solid #1f2736; }
        .meter-title { font-size: 0.75rem; color: var(--text-muted); margin-bottom: 4px; }
        .meter-value { font-size: 1.3rem; font-weight: bold; font-family: monospace; }
        .unit { font-size: 0.75rem; color: #55657d; margin-left: 2px; }
    </style>
</head>
<body>

    <div class="nav"><a href="../index.html">← 返回首頁</a></div>

    <header>
        <h1>🧪 李捷物理實驗室</h1>
        <p class="subtitle">完全彈性碰撞：形變與 v-t 圖動態解析</p>
    </header>

    <div class="container">
        <div class="card">
            <div class="card-title">
                <span>物理真實場景 (形變與相對距離)</span>
                <span id="collision-indicator" style="font-size:0.8rem; padding:2px 6px; border-radius:4px;">未碰撞</span>
            </div>
            <div id="canvas-container">
                <canvas id="simCanvas" width="800" height="200"></canvas>
            </div>
        </div>

        <div class="card">
            <div class="card-title">實驗參數設定與時間控制</div>
            <div class="controls-grid">
                <div class="control-group">
                    <div class="control-label">球 A 質量 <b class="cyan-text"><span id="lbl_mA">2.0</span> kg</b></div>
                    <input type="range" id="param_mA" min="0.5" max="5.0" value="2.0" step="0.1">
                </div>
                <div class="control-group">
                    <div class="control-label">球 A 初速 <b class="cyan-text"><span id="lbl_vA">5.0</span> m/s</b></div>
                    <input type="range" id="param_vA" min="0.0" max="10.0" value="5.0" step="0.5">
                </div>
                <div class="control-group">
                    <div class="control-label">球 B 質量 <b class="pink-text"><span id="lbl_mB">1.0</span> kg</b></div>
                    <input type="range" id="param_mB" min="0.5" max="5.0" value="1.0" step="0.1">
                </div>
                <div class="control-group">
                    <div class="control-label">球 B 初速 <b class="pink-text"><span id="lbl_vB">-5.0</span> m/s</b></div>
                    <input type="range" id="param_vB" min="-10.0" max="0.0" value="-5.0" step="0.5">
                </div>
            </div>

            <div class="playback-bar">
                <button id="btnPlayPause">暫停</button>
                <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 4px;">
                    <div style="display:flex; justify-content:space-between; font-size:0.8rem; color:var(--text-muted);">
                        <span>時間軸自由拖曳</span>
                        <span>t = <b id="lbl_time" style="color:#fff; font-family:monospace;">0.00</b> s</span>
                    </div>
                    <input type="range" id="timeSlider" min="0" max="1999" value="0">
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-title">速度 - 時間 (v-t) 變化曲線圖</div>
            <div class="chart-container">
                <canvas id="vtChart"></canvas>
            </div>
        </div>

        <div class="card">
            <div class="card-title">即時物理狀態與能量分析</div>
            <div class="dashboard-grid">
                <div class="meter" style="border-left: 3px solid var(--cyan);">
                    <div class="meter-title">A球速度 (vA)</div>
                    <div class="meter-value cyan-text" id="dat_vA">0.00<span class="unit">m/s</span></div>
                </div>
                <div class="meter" style="border-left: 3px solid var(--pink);">
                    <div class="meter-title">B球速度 (vB)</div>
                    <div class="meter-value pink-text" id="dat_vB">0.00<span class="unit">m/s</span></div>
                </div>
                <div class="meter" style="border-left: 3px solid var(--yellow);">
                    <div class="meter-title">質心速度 (Vcm)</div>
                    <div class="meter-value" id="dat_vc" style="color:var(--yellow);">0.00<span class="unit">m/s</span></div>
                </div>
                <div class="meter">
                    <div class="meter-title">質心動能 (K_cm)</div>
                    <div class="meter-value" id="dat_Kc">0.00<span class="unit">J</span></div>
                </div>
                <div class="meter" style="border-left: 3px solid var(--green);">
                    <div class="meter-title">內動能 (K_int)</div>
                    <div class="meter-value" id="dat_Kint" style="color:var(--green);">0.00<span class="unit">J</span></div>
                </div>
                <div class="meter" style="border-left: 3px solid #ff9100;">
                    <div class="meter-title">彈性位能 (U)</div>
                    <div class="meter-value" id="dat_Us" style="color:#ff9100;">0.00<span class="unit">J</span></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');
        
        // --- 核心物理比例尺與常數 ---
        const DT = 0.002;          // 時間步長 0.002s
        const TOTAL_STEPS = 2000;  // 總時長 4.0s
        const R_METER = 1.0;       // 球的真實物理半徑 (1公尺)
        const K_SPRING = 200;      // 彈簧常數調軟！讓碰撞時間拉長到肉眼可見 (約0.4秒)
        const SCALE = 45;          // 畫面比例：1公尺 = 45像素
        const R_PX = R_METER * SCALE; 
        
        let simulationHistory = []; 
        let currentIndex = 0;
        let isPlaying = true;
        let chartInstance = null;

        const pmA = document.getElementById('param_mA');
        const pvA = document.getElementById('param_vA');
        const pmB = document.getElementById('param_mB');
        const pvB = document.getElementById('param_vB');
        
        const lblmA = document.getElementById('lbl_mA');
        const lblvA = document.getElementById('lbl_vA');
        const lblmB = document.getElementById('lbl_mB');
        const lblvB = document.getElementById('lbl_vB');
        
        const btnPlayPause = document.getElementById('btnPlayPause');
        const timeSlider = document.getElementById('timeSlider');
        const lblTime = document.getElementById('lbl_time');
        const colIndicator = document.getElementById('collision-indicator');

        function runPhysicsSimulation() {
            simulationHistory = [];
            
            let mA = parseFloat(pmA.value);
            let vA = parseFloat(pvA.value);
            let mB = parseFloat(pmB.value);
            let vB = parseFloat(pvB.value);
            
            // 初始位置設定：A在左(4m)，B在右(14m)，總畫布約寬度18m
            let xA = 4.0;
            let xB = 14.0;

            for (let step = 0; step < TOTAL_STEPS; step++) {
                let t = step * DT;
                
                // 距離與壓縮量
                let dx = xB - xA;
                let distance = Math.abs(dx);
                let overlap = (R_METER * 2) - distance;
                
                let force = 0;
                let Us = 0;
                
                // 發生碰撞形變
                if (overlap > 0) {
                    force = K_SPRING * overlap; // 虎克定律
                    Us = 0.5 * K_SPRING * overlap * overlap; // 彈性位能
                }
                
                // 計算加速度 (A在左受向左的力，B在右受向右的力)
                let aA = -force / mA;
                let aB = force / mB;
                
                // 更新速度與位置
                vA += aA * DT;
                vB += aB * DT;
                xA += vA * DT;
                xB += vB * DT;
                
                // 能量計算
                let vc = (mA * vA + mB * vB) / (mA + mB);
                let Kc = 0.5 * (mA + mB) * vc * vc;
                let Ktotal = 0.5 * mA * vA * vA + 0.5 * mB * vB * vB;
                let Kint = Ktotal - Kc;
                if (Kint < 0) Kint = 0; 

                simulationHistory.push({
                    t: t, 
                    xA: xA, xB: xB, distance: distance,
                    vA: vA, vB: vB, vc: vc, Kc: Kc, Kint: Kint, Us: Us,
                    overlap: overlap > 0 ? overlap : 0
                });
            }
        }

        function initChart() {
            const ctxChart = document.getElementById('vtChart').getContext('2d');
            const labels = simulationHistory.map(d => d.t.toFixed(2));
            const dataA = simulationHistory.map(d => d.vA);
            const dataB = simulationHistory.map(d => d.vB);
            const dataVc = simulationHistory.map(d => d.vc); // 質心速度線

            if(chartInstance) {
                chartInstance.destroy(); 
            }

            chartInstance = new Chart(ctxChart, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [
                        { label: 'A球速度', data: dataA, borderColor: '#00d4ff', borderWidth: 2, pointRadius: 0, tension: 0.1 },
                        { label: 'B球速度', data: dataB, borderColor: '#ff2e63', borderWidth: 2, pointRadius: 0, tension: 0.1 },
                        { label: '質心速度', data: dataVc, borderColor: 'rgba(255, 204, 0, 0.5)', borderWidth: 2, borderDash: [5, 5], pointRadius: 0, fill: false },
                        { label: '時間軸', data: [], borderColor: '#ffffff', borderWidth: 1, pointRadius: 0, fill: false }
                    ]
                },
                options: {
                    responsive: true, maintainAspectRatio: false, animation: false,
                    interaction: { mode: 'index', intersect: false },
                    scales: {
                        x: { grid: { color: '#1a2230' }, ticks: { color: '#8a99ad', maxTicksLimit: 10 } },
                        y: { grid: { color: '#1a2230' }, ticks: { color: '#8a99ad' }, title: { display: true, text: '速度 (m/s)', color: '#8a99ad' } }
                    },
                    plugins: { legend: { labels: { color: '#f0f3f8', font: { size: 12 } } } }
                }
            });
        }

        function renderFrame() {
            const data = simulationHistory[currentIndex];
            if (!data) return;

            lblTime.innerText = data.t.toFixed(2);
            timeSlider.value = currentIndex;

            // 更新儀表板數據
            document.getElementById('dat_vA').innerHTML = `${data.vA.toFixed(2)}<span class="unit">m/s</span>`;
            document.getElementById('dat_vB').innerHTML = `${data.vB.toFixed(2)}<span class="unit">m/s</span>`;
            document.getElementById('dat_vc').innerHTML = `${data.vc.toFixed(2)}<span class="unit">m/s</span>`;
            document.getElementById('dat_Kc').innerHTML = `${data.Kc.toFixed(2)}<span class="unit">J</span>`;
            document.getElementById('dat_Kint').innerHTML = `${data.Kint.toFixed(2)}<span class="unit">J</span>`;
            document.getElementById('dat_Us').innerHTML = `${data.Us.toFixed(2)}<span class="unit">J</span>`;

            // 狀態指示燈
            if (data.overlap > 0) {
                colIndicator.innerText = "💥 壓縮形變中";
                colIndicator.style.backgroundColor = "rgba(255, 46, 99, 0.2)";
                colIndicator.style.color = "#ff2e63"; 
            } else {
                colIndicator.innerText = "未碰撞";
                colIndicator.style.backgroundColor = "rgba(0, 230, 118, 0.1)";
                colIndicator.style.color = "#00e676";
            }

            // 更新圖表上的垂直時間線
            const minV = -15, maxV = 15;
            chartInstance.data.datasets[3].data = [
                {x: chartInstance.data.labels[currentIndex], y: minV},
                {x: chartInstance.data.labels[currentIndex], y: maxV}
            ];
            chartInstance.update('none');

            // --- Canvas 繪圖 ---
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            let cy = canvas.height / 2 + 20; // 稍微往下移，留出上方畫距離線的空間

            // 畫中心軌道線
            ctx.strokeStyle = '#1a2230'; ctx.lineWidth = 2; ctx.setLineDash([5, 5]);
            ctx.beginPath(); ctx.moveTo(0, cy); ctx.lineTo(canvas.width, cy); ctx.stroke(); ctx.setLineDash([]);

            // 換算畫面座標
            let px_xA = data.xA * SCALE;
            let px_xB = data.xB * SCALE;
            let px_overlap = data.overlap * SCALE;

            // 繪製上方「距離 d = ...」標示線
            ctx.strokeStyle = '#8a99ad'; ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(px_xA, cy - R_PX - 15);
            ctx.lineTo(px_xB, cy - R_PX - 15);
            ctx.stroke();
            
            // 兩端的垂直小短線
            ctx.beginPath(); ctx.moveTo(px_xA, cy - R_PX - 20); ctx.lineTo(px_xA, cy - R_PX - 10); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(px_xB, cy - R_PX - 20); ctx.lineTo(px_xB, cy - R_PX - 10); ctx.stroke();

            // 距離文字
            ctx.fillStyle = '#f0f3f8'; ctx.font = '12px sans-serif'; ctx.textAlign = 'center';
            ctx.fillText(`距離 d = ${data.distance.toFixed(2)} m`, (px_xA + px_xB) / 2, cy - R_PX - 25);

            // 完美的形變數學：若壓縮，rx 減少一半，兩球邊緣剛好完美貼齊在中心
            let rx = R_PX - (px_overlap / 2); 
            let ry = R_PX + (px_overlap * 0.6); // 縱向稍微隆起表現體積守恆
            if (rx < 5) rx = 5; // 極限保護
            
            // 畫球 A
            ctx.beginPath();
            ctx.ellipse(px_xA, cy, rx, ry, 0, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(0, 212, 255, 0.85)';
            ctx.shadowBlur = data.overlap > 0 ? 20 : 10;
            ctx.shadowColor = 'rgba(0, 212, 255, 0.5)';
            ctx.fill();
            
            // 畫球 B
            ctx.beginPath();
            ctx.ellipse(px_xB, cy, rx, ry, 0, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255, 46, 99, 0.85)';
            ctx.shadowBlur = data.overlap > 0 ? 20 : 10;
            ctx.shadowColor = 'rgba(255, 46, 99, 0.5)';
            ctx.fill();
            
            // 標籤文字
            ctx.shadowBlur = 0; ctx.fillStyle = '#fff'; ctx.font = 'bold 16px sans-serif'; ctx.textBaseline = 'middle';
            ctx.fillText('A', px_xA, cy);
            ctx.fillText('B', px_xB, cy);
        }

        function tick() {
            if (isPlaying) {
                currentIndex += 4; // 播放速度微調
                if (currentIndex >= TOTAL_STEPS) currentIndex = 0; 
                renderFrame();
            }
            requestAnimationFrame(tick);
        }

        function refreshExperiment() {
            lblmA.innerText = parseFloat(pmA.value).toFixed(1);
            lblvA.innerText = parseFloat(pvA.value).toFixed(1);
            lblmB.innerText = parseFloat(pmB.value).toFixed(1);
            lblvB.innerText = parseFloat(pvB.value).toFixed(1);

            runPhysicsSimulation();
            initChart();
            renderFrame();
        }

        btnPlayPause.addEventListener('click', () => {
            isPlaying = !isPlaying;
            btnPlayPause.innerText = isPlaying ? '暫停' : '播放';
        });

        timeSlider.addEventListener('input', function() {
            isPlaying = false; 
            btnPlayPause.innerText = '播放';
            currentIndex = parseInt(this.value);
            renderFrame();
        });

        [pmA, pvA, pmB, pvB].forEach(slider => {
            slider.addEventListener('input', refreshExperiment);
        });

        // 啟動
        runPhysicsSimulation();
        initChart();
        requestAnimationFrame(tick);
    </script>
</body>
</html>
