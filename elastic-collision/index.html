<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>一維完全彈性碰撞模擬器</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-main: #0a0c10;
            --bg-card: #141923;
            --bg-control: #1d2432;
            --text-main: #f0f3f8;
            --text-muted: #8a99ad;
            --cyan: #00d4ff;
            --pink: #ff2e63;
            --yellow: #ffcc00;
            --green: #00e676;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        /* 導覽列 */
        .nav { width: 100%; max-width: 800px; margin-bottom: 10px; }
        .nav a { color: var(--cyan); text-decoration: none; font-size: 14px; }

        header { text-align: center; margin-bottom: 15px; width: 100%; max-width: 800px; }
        h1 { margin: 0; font-size: 1.6rem; color: var(--cyan); letter-spacing: 1px; }
        p.subtitle { margin: 5px 0 0 0; font-size: 0.9rem; color: var(--text-muted); }

        .container { width: 100%; max-width: 800px; display: flex; flex-direction: column; gap: 15px; }

        .card {
            background-color: var(--bg-card);
            border-radius: 12px; border: 1px solid #252e3d;
            padding: 15px; box-sizing: border-box;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }

        .card-title {
            font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px;
            color: var(--text-muted); margin-bottom: 10px; font-weight: bold;
            display: flex; justify-content: space-between; align-items: center;
        }

        #canvas-container {
            width: 100%; display: flex; justify-content: center;
            background: #080a0f; border-radius: 8px; overflow: hidden; border: 1px solid #1a202c;
        }
        canvas { width: 100%; height: auto; max-height: 160px; display: block; }

        .controls-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; margin-bottom: 15px;
        }

        .control-group {
            background-color: rgba(255,255,255,0.02); padding: 10px; border-radius: 8px; border: 1px solid #222b3a;
        }

        .control-label { display: flex; justify-content: space-between; font-size: 0.85rem; margin-bottom: 6px; color: #b0c0d6; }
        .control-label b { font-family: monospace; font-size: 1rem; }
        
        .cyan-text { color: var(--cyan); }
        .pink-text { color: var(--pink); }

        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; margin: 0; }
        input[type=range]:focus { outline: none; }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 5px; cursor: pointer; background: #2c3749; border-radius: 3px; }
        input[type=range]::-webkit-slider-thumb {
            height: 16px; width: 16px; border-radius: 50%; background: #fff; cursor: pointer;
            -webkit-appearance: none; margin-top: -5px; box-shadow: 0 0 8px rgba(255,255,255,0.5);
        }

        .playback-bar {
            display: flex; align-items: center; gap: 15px; margin-top: 10px;
            background: rgba(255,255,255,0.03); padding: 10px; border-radius: 8px;
        }

        button {
            background-color: var(--cyan); color: #000; border: none; padding: 8px 16px;
            font-size: 0.9rem; font-weight: bold; border-radius: 6px; cursor: pointer; min-width: 80px;
        }
        button:hover { opacity: 0.9; box-shadow: 0 0 10px rgba(0, 212, 255, 0.5); }

        .chart-container { position: relative; width: 100%; height: 220px; }

        .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; }
        .meter { background: #111622; padding: 12px; border-radius: 8px; text-align: center; border: 1px solid #1f2736; }
        .meter-title { font-size: 0.75rem; color: var(--text-muted); margin-bottom: 4px; }
        .meter-value { font-size: 1.3rem; font-weight: bold; font-family: monospace; }
        .unit { font-size: 0.75rem; color: #55657d; margin-left: 2px; }
    </style>
</head>
<body>

    <div class="nav"><a href="../index.html">← 返回首頁</a></div>

    <header>
        <h1>🧪 李捷物理實驗室</h1>
        <p class="subtitle">一維完全彈性碰撞動態模擬器</p>
    </header>

    <div class="container">
        <div class="card">
            <div class="card-title">
                <span>碰撞與形變即時視覺動畫</span>
                <span id="collision-indicator" style="font-size:0.8rem; padding:2px 6px; border-radius:4px;">未碰撞</span>
            </div>
            <div id="canvas-container">
                <canvas id="simCanvas" width="800" height="160"></canvas>
            </div>
        </div>

        <div class="card">
            <div class="card-title">實驗參數設定與時間控制</div>
            <div class="controls-grid">
                <div class="control-group">
                    <div class="control-label">球 A 質量 <b class="cyan-text"><span id="lbl_mA">2.0</span> kg</b></div>
                    <input type="range" id="param_mA" min="0.5" max="5.0" value="2.0" step="0.1">
                </div>
                <div class="control-group">
                    <div class="control-label">球 A 初速 <b class="cyan-text"><span id="lbl_vA">5.0</span> m/s</b></div>
                    <input type="range" id="param_vA" min="0.0" max="10.0" value="5.0" step="0.5">
                </div>
                <div class="control-group">
                    <div class="control-label">球 B 質量 <b class="pink-text"><span id="lbl_mB">1.0</span> kg</b></div>
                    <input type="range" id="param_mB" min="0.5" max="5.0" value="1.0" step="0.1">
                </div>
                <div class="control-group">
                    <div class="control-label">球 B 初速 <b class="pink-text"><span id="lbl_vB">-6.0</span> m/s</b></div>
                    <input type="range" id="param_vB" min="-10.0" max="0.0" value="-6.0" step="0.5">
                </div>
            </div>

            <div class="playback-bar">
                <button id="btnPlayPause">暫停</button>
                <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 4px;">
                    <div style="display:flex; justify-content:space-between; font-size:0.8rem; color:var(--text-muted);">
                        <span>時間軸自由拖曳</span>
                        <span>t = <b id="lbl_time" style="color:#fff; font-family:monospace;">
