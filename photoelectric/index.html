<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>光電效應實驗 - 進階版</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background: #000; color: #eee; margin: 0; padding: 10px;
            display: flex; flex-direction: column; align-items: center;
            overscroll-behavior: none;
        }
        .nav { width: 100%; margin-bottom: 10px; }
        .nav a { color: #00d4ff; text-decoration: none; font-size: 14px; }

        /* 控制面板 */
        .controls-container {
            width: 100%; max-width: 600px;
            background: #1a1a1a; padding: 15px 20px; border-radius: 12px;
            margin-bottom: 15px; box-sizing: border-box; border: 1px solid #333;
        }
        .slider-group { margin-bottom: 15px; }
        .slider-group:last-child { margin-bottom: 0; }
        .slider-label { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 15px; color: #ccc; }
        .slider-label b { color: #00d4ff; font-family: monospace; font-size: 1.1em; }
        
        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none; height: 20px; width: 20px; border-radius: 50%;
            background: #00d4ff; cursor: pointer; margin-top: -8px; box-shadow: 0 0 8px rgba(0,212,255,0.6);
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%; height: 4px; cursor: pointer; background: #444; border-radius: 2px;
        }

        /* 畫布與數據區 */
        #canvas-container { 
            width: 100%; max-width: 600px; 
            display: flex; justify-content: center; margin-bottom: 15px;
            position: relative;
        }
        canvas { border-radius: 4px; border: 1px solid #333; background: #080808; }

        /* 結果顯示儀表板 */
        .dashboard {
            width: 100%; max-width: 600px;
            display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
        }
        .meter {
            background: #1a1a1a; padding: 15px; border-radius: 12px;
            text-align: center; border: 1px solid #333;
        }
        .meter-title { font-size: 12px; color: #888; margin-bottom: 5px; }
        .meter-value { font-size: 24px; font-weight: bold; color: #fff; }
        .meter-unit { font-size: 14px; color: #666; }
        
        .highlight-g { color: #00ff00; } /* 綠色：有能量 */
        .highlight-r { color: #ff4444; } /* 紅色：能量不足 */
    </style>
</head>
<body>
    <div class="nav"><a href="../index.html">← 返回首頁</a></div>

    <div class="controls-container">
        <div class="slider-group">
            <div class="slider-label">
                入射光頻率 (f)
                <b id="val_f">10.0</b> <span style="font-size:0.8em; color:#888;">x10¹⁴ Hz</span>
            </div>
            <input type="range" id="sl_f" min="2.0" max="20.0" value="10.0" step="0.1">
        </div>

        <div class="slider-group">
            <div class="slider-label">
                光強度 (I) - 光子數密度
                <b id="val_I">5.0</b> <span style="font-size:0.8em; color:#888;">（相對值）</span>
            </div>
            <input type="range" id="sl_I" min="0.0" max="10.0" value="5.0" step="0.5">
        </div>

        <div class="slider-group">
            <div class="slider-label">
                金屬功函數 (W)
                <b id="val_W">2.50</b> <span style="font-size:0.8em; color:#888;">eV</span>
            </div>
            <input type="range" id="sl_W" min="1.0" max="6.0" value="2.50" step="0.05">
        </div>
    </div>

    <div id="canvas-container"></div>

    <div class="dashboard">
        <div class="meter">
            <div class="meter-title">光子能量 (E=hf)</div>
            <div id="disp_E" class="meter-value">4.14</div>
            <span class="meter-unit">eV</span>
        </div>
        <div class="meter" style="border-color: #00d4ff;">
            <div class="meter-title">電子最大動能 (Kmax)</div>
            <div id="disp_K" class="meter-value highlight-g">1.64</div>
            <span class="meter-unit">eV</span>
        </div>
    </div>

    <script>
        let sl_f, sl_W, sl_I;
        let electrons = [];
        let photons = [];
        let metalY;
        let canvasW, canvasH;
        
        // 物理常數
        // h 單位換算修正後: E(eV) = h * f(10^14 Hz)
        const H_CONST = 0.41357; 

        function setup() {
            canvasW = min(windowWidth - 20, 600);
            canvasH = 320; // 稍微加高以容納文字
            let cnv = createCanvas(canvasW, canvasH);
            cnv.parent('canvas-container');
            
            sl_f = select('#sl_f');
            sl_W = select('#sl_W');
            sl_I = select('#sl_I'); // 新增強度控制
            
            metalY = height - 50; 
        }

        function draw() {
            background(10);
            
            // 讀取數值
            let f_val = float(sl_f.value());
            let W_val = float(sl_W.value());
            let I_val = float(sl_I.value()); // 強度
            
            // 計算物理量
            let E_photon = f_val * H_CONST;
            let K_max = E_photon - W_val;
            
            // 計算底限頻率 f0 = W / h
            let f0 = W_val / H_CONST;

            // UI 更新
            select('#val_f').html(f_val.toFixed(1));
            select('#val_W').html(W_val.toFixed(2));
            select('#val_I').html(I_val.toFixed(1));
            select('#disp_E').html(E_photon.toFixed(2));
            
            let kDisplay = select('#disp_K');
            if (K_max > 0) {
                kDisplay.html(K_max.toFixed(2));
                kDisplay.class("meter-value highlight-g");
            } else {
                kDisplay.html("0.00");
                kDisplay.class("meter-value highlight-r");
            }

            // 1. 光子發射邏輯 (由強度 I 控制)
            // I 越大，單位時間產生的光子機率越高
            if (I_val > 0) {
                let emissionProb = map(I_val, 0, 10, 0, 0.3); // 調整發射機率
                if (random(1) < emissionProb) {
                    emitPhoton(f_val);
                }
            }

            // 2. 繪製手電筒
            drawFlashlight(f_val, I_val);

            // 3. 處理光子動畫
            let photonColor = freqToColor(f_val);
            for (let i = photons.length - 1; i >= 0; i--) {
                let p = photons[i];
                p.update();
                p.display(photonColor);
                
                // 撞擊金屬偵測
                if (p.pos.y >= metalY && p.pos.x > 50 && p.pos.x < width - 50) {
                    // 只有當能量大於功函數時，才"有機率"打出電子
                    // (並非每顆光子都一定打出電子，這裡為了效果簡化為 100% 轉換，只要能量夠)
                    if (K_max > 0) {
                        spawnElectron(p.pos.x, K_max);
                    }
                    photons.splice(i, 1); 
                } else if (p.pos.y > height || p.pos.x > width) {
                    photons.splice(i, 1);
                }
            }

            // 4. 處理電子動畫
            for (let i = electrons.length - 1; i >= 0; i--) {
                let e = electrons[i];
                e.update();
                e.display();
                if (e.pos.y < 0 || e.pos.x > width || e.pos.x < 0) {
                    electrons.splice(i, 1);
                }
            }

            // 5. 繪製金屬板與資訊
            drawMetal(W_val, f0, K_max > 0);
            drawLightInfo(f_val);
        }

        // --- 輔助函數 ---

        function emitPhoton(freq) {
            let startX = 60;
            let startY = 60;
            let targetX = random(100, width - 50);
            let targetY = metalY;
            photons.push(new Photon(startX, startY, targetX, targetY));
        }

        function spawnElectron(x, k_max) {
            // Kmax 是「最大」動能：金屬表面的電子剛好帶 Kmax，較深處的電子要損失能量才能逸出，動能較小 (0 ~ Kmax)。
            // 這裡約 30% 的電子帶 Kmax，其餘在 5%~100% Kmax 之間（示意分布）。
            let u = (random(1) < 0.3) ? 1 : random(0.05, 1);
            let speed = sqrt(k_max * u) * 2.0; // 動能 K ∝ v²，所以 v ∝ √K
            let angle = random(-2*PI/3, -PI/3);
            electrons.push(new Electron(x, metalY - 5, speed, angle, u));
        }

        class Photon {
            constructor(x, y, tx, ty) {
                this.pos = createVector(x, y);
                let dir = createVector(tx - x, ty - y);
                dir.normalize();
                this.vel = dir.mult(4); // **速度調慢** (原為 8，現在改為 4，方便肉眼觀察)
                this.w = 0; 
            }
            update() {
                this.pos.add(this.vel);
                this.w += 0.5;
            }
            display(c) {
                push();
                stroke(c);
                strokeWeight(2);
                noFill();
                translate(this.pos.x, this.pos.y);
                rotate(this.vel.heading());
                // 畫出小波包 (光子)
                beginShape();
                for(let i=-8; i<8; i+=2) {
                    vertex(i, sin(i*0.6 + this.w)*3);
                }
                endShape();
                pop();
            }
        }

        class Electron {
            constructor(x, y, speed, angle, u) {
                this.pos = createVector(x, y);
                this.vel = p5.Vector.fromAngle(angle).mult(speed);
                this.u = (u === undefined) ? 1 : u; // 動能相對於 Kmax 的比例
            }
            update() {
                this.pos.add(this.vel);
            }
            display() {
                push();
                translate(this.pos.x, this.pos.y);
                noStroke();
                fill(0, 255, 255, 30 + 120 * this.u); // 電子光暈：越亮代表動能越接近 Kmax
                ellipse(0, 0, 10, 10);
                fill(255); // 電子核心
                ellipse(0, 0, 4, 4);
                pop();
            }
        }

        function drawFlashlight(freq, intensity) {
            push();
            translate(40, 40);
            rotate(PI/6);
            
            let c = freqToColor(freq);
            
            // 筒身
            fill(50); stroke(100); strokeWeight(1);
            rect(0, -15, 60, 30, 5);
            // 燈頭
            fill(80);
            rect(60, -20, 10, 40, 2);
            
            // 發光處 (根據強度改變透明度)
            let alpha = map(intensity, 0, 10, 50, 255);
            fill(red(c), green(c), blue(c), alpha); 
            noStroke();
            ellipse(70, 0, 15, 30);
            
            // 光束光暈 (只有當強度 > 0 才顯示)
            if (intensity > 0.1) {
                fill(red(c), green(c), blue(c), map(intensity, 0, 10, 10, 60));
                triangle(70, -10, 70, 10, 400, 150);
            }
            
            pop();
        }

        function drawMetal(W, f0, isActive) {
            // 金屬塊
            fill(30); stroke(100); strokeWeight(1);
            rect(50, metalY, width-100, 40); // 加厚一點
            
            stroke(60);
            for(let i=60; i<width-60; i+=20) {
                line(i, metalY, i+10, metalY+40);
            }

            // 文字標示區
            noStroke(); 
            textAlign(CENTER);
            
            // 第一行：金屬功函數
            fill(200); textSize(14);
            text(`Metal (W = ${W.toFixed(2)} eV)`, width/2, metalY + 20);
            
            // 第二行：底限頻率 (這是你要求新增的)
            fill(0, 212, 255); textSize(12);
            text(`底限頻率 f₀ = ${f0.toFixed(2)} x10¹⁴ Hz`, width/2, metalY + 36);
            
            // 狀態警示
            if (!isActive) {
                fill(255, 50, 50); textSize(12);
                text("🚫 能量不足 ( f < f₀ )", width/2, metalY - 10);
            }
        }

        // 可見光約 4.0 ~ 7.5 ×10¹⁴ Hz（波長約 750 ~ 400 nm）；低於是紅外線、高於是紫外線（人眼看不到）
        const VIS_LOW = 4.0, VIS_HIGH = 7.5;

        function lightType(f) {
            if (f < VIS_LOW) return '紅外線（不可見）';
            if (f > VIS_HIGH) return '紫外線（不可見）';
            return '可見光';
        }

        function freqToColor(f) {
            if (f < VIS_LOW) return color(110, 0, 0);      // 紅外線：暗紅（示意，實際看不到）
            if (f > VIS_HIGH) return color(175, 130, 255); // 紫外線：淡紫（示意，實際看不到）
            let h = map(f, VIS_LOW, VIS_HIGH, 0, 280);     // 紅 → 紫
            colorMode(HSB, 360, 100, 100);
            let c = color(h, 100, 100);
            colorMode(RGB);
            return c;
        }

        // 畫面右上角：波長與光的種類、電子亮度說明
        function drawLightInfo(f) {
            let lam = 3000 / f; // λ = c / f，c = 3.00×10⁸ m/s，f 以 10¹⁴ Hz 計 → λ(nm) = 3000 / f
            push();
            noStroke();
            textAlign(RIGHT);
            textSize(13);
            fill(freqToColor(f));
            text(`λ ≈ ${lam.toFixed(0)} nm　${lightType(f)}`, width - 12, 22);
            fill(150);
            textSize(11);
            text('電子動能介於 0 ~ Kmax（越亮越接近 Kmax）', width - 12, 40);
            pop();
        }

        function windowResized() {
            canvasW = min(windowWidth - 20, 600);
            resizeCanvas(canvasW, 320);
            metalY = height - 50;
        }
    </script>
</body>
</html>
